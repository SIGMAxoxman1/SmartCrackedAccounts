name: Build SmartCrackedAccounts

# يشتغل تلقائياً على كل push أو pull request على main
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  # بيسمح تشغله يدوياً من GitHub
  workflow_dispatch:

jobs:
  build:
    name: Build Plugin
    runs-on: ubuntu-latest

    steps:
      # الخطوة 1: تنزيل الكود من الـ repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # الخطوة 2: تنصيب Java 21 (مطلوب لـ Paper 1.21.4)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven  # بيكاش الـ dependencies عشان يبني أسرع المرة الجاية

      # الخطوة 3: بناء الـ plugin
      - name: Build with Maven
        run: mvn clean package --no-transfer-progress

      # الخطوة 4: رفع الـ JAR الناتج كـ artifact عشان تقدر تنزله من GitHub
      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: SmartCrackedAccounts-${{ github.sha }}
          path: target/SmartCrackedAccounts-*.jar
          # يحتفظ بالـ JAR لمدة 30 يوم
          retention-days: 30

      # الخطوة 5: لو push على main، يعمل Release تلقائي
      - name: Create Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Build #${{ github.run_number }}"
          body: |
            🔨 Build تلقائي من GitHub Actions
            📝 آخر تعديل: ${{ github.event.head_commit.message }}
            📦 نزّل الـ JAR من الـ Assets تحت
          files: target/SmartCrackedAccounts-*.jar
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
