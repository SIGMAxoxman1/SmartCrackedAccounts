# ======================================================
#        SmartCrackedAccounts - config.yml
#        الإصدار: 1.0.0
#        البلجن بيعمل الملف ده تلقائياً أول مرة
# ======================================================
# دليل الألوان:
#   &0أسود  &1كحلي  &2أخضر غامق  &3سماوي غامق
#   &4أحمر غامق  &5بنفسجي  &6ذهبي  &7رمادي
#   &8رمادي غامق  &9أزرق  &aأخضر  &bسماوي
#   &cأحمر  &dوردي  &eأصفر  &fأبيض
#   &lعريض  &oمائل  &nتحته خط  &mمشطوب  &rإعادة تعيين
# ======================================================

# =====================
#   القائمة البيضاء
# =====================
whitelisted-players:
  - "ExamplePlayer1"
  - "ExamplePlayer2"

# =====================
#   إعدادات اللوبي
# =====================
lobby-world: "auth_lobby"

lobby-location:
  x: 0.5
  y: 64.0
  z: 0.5
  yaw: 0.0
  pitch: 0.0

# =====================
#   إعدادات الأمان
# =====================
login-timeout: 60
min-password-length: 6
max-wrong-attempts: 3
protect-inventory: true
prevent-movement: true
prevent-chat: true
prevent-damage: true

# =====================
#   إعدادات Floodgate
# =====================
use-floodgate: true

# =====================
#       الرسائل
# =====================
messages:
  not-whitelisted: "&c\n &c✖ مش مسموحلك تدخل السيرفر ده!\n &eكلم الأدمن عشان يضيف اسمك.\n"
